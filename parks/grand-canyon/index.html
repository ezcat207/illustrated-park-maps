<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Canyon National Park · Illustrated Travel Map</title>
<style>
  :root{ --paper:#f6eeda; --ink:#4a3826; --accent:#8a5a2b; --gold:#e8a13a; }
  *{box-sizing:border-box}
  body{margin:0;background:#e7d9b8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  #app{max-width:1180px;margin:0 auto;padding:10px 10px 4px}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 2px 10px}
  h1{font-size:22px;margin:0;letter-spacing:1px}
  h1 .en{display:block;font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:14px;color:#8a6a45;font-weight:normal;letter-spacing:0}
  .sub{margin:3px 0 0;font-size:13px;color:#8a6a45}
  #mapwrap{position:relative;border:3px solid var(--accent);border-radius:14px;overflow:hidden;
    background:var(--paper);box-shadow:0 4px 18px rgba(90,60,20,.25)}
  svg#map{display:block;width:100%;height:auto;touch-action:manipulation}
  .maplabel{font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
    fill:#6a4a28;paint-order:stroke;stroke:#f6eeda;stroke-width:3px}
  .plabel{font-size:13px;font-weight:bold;fill:#3f2d18;paint-order:stroke;stroke:#fbf5e3;stroke-width:3.5px}
  .plabel.en{font-size:10.5px;font-weight:normal;font-family:"Segoe Print","Chalkboard SE",cursive}
  .poi{cursor:pointer}
  .poi .badge{fill:#fffdf5;stroke:#8a5a2b;stroke-width:3}
  .poi.sec .badge{fill:#f7efdc}
  .poi:focus{outline:none}
  .poi:focus .badge,.poi:hover .badge{stroke:#b3541e;stroke-width:4}
  .poi .glyph{color:#5a3d1e}
  .leader{stroke:#8a5a2b;stroke-width:1.6;stroke-dasharray:4 3;opacity:.75}
  .truedot{fill:#8a5a2b;opacity:.8}
  /* legend */
  #legend{position:absolute;left:10px;bottom:10px;background:rgba(255,253,245,.95);border:2px solid var(--accent);
    border-radius:10px;padding:6px 10px;font-size:12px;max-width:262px;z-index:4;line-height:1.7}
  #legend summary{cursor:pointer;font-weight:bold;font-size:13px}
  #legend .row{display:flex;align-items:center;gap:6px}
  #legend svg{flex:0 0 auto}
  #legend .cats{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
  /* popup */
  #popup{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(450px,calc(100% - 24px));
    background:#fffdf5;border:2.5px solid var(--accent);border-radius:14px;padding:14px 16px 12px;
    box-shadow:0 8px 26px rgba(60,35,10,.32);z-index:6}
  @media(min-width:700px){ #popup{left:auto;right:14px;transform:none} }
  #popup[hidden]{display:none}
  #popClose{position:absolute;top:6px;right:10px;border:none;background:none;font-size:22px;cursor:pointer;color:#8a6a45;line-height:1}
  #popPills{display:flex;gap:6px;margin:2px 26px 6px 0;flex-wrap:wrap}
  .pill{font-size:11px;border-radius:999px;padding:2px 9px;border:1.5px solid}
  .pill.rec{color:#8a4d00;border-color:var(--gold);background:#fdf0d5;font-weight:bold}
  .pill.sec{color:#6a5a3a;border-color:#b09a6a;background:#f6eeda}
  .pill.cat{color:#4a5a6a;border-color:#7a9ab0;background:#eef4f8}
  #popName{margin:0;font-size:19px}
  #popImg{width:100%;height:150px;object-fit:cover;border-radius:10px;border:2px solid var(--accent);margin-bottom:8px;display:block}
  .legimg{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--accent);object-fit:cover;flex:0 0 auto}
  .legimg.small{width:32px;height:32px}
  #popBlurb{margin:0;font-size:14px;line-height:1.65}
  #popNote{margin:8px 0 0;font-size:11.5px;color:#a08050}
  footer{padding:8px 4px 14px;font-size:11.5px;color:#a08050;text-align:center}
  @media(max-width:640px){
    h1{font-size:17px} h1 .en{font-size:12px}
    .sub{font-size:11.5px}
    #legend{font-size:11px;max-width:210px;padding:4px 8px}
    #popBlurb{font-size:13.5px}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>Grand Canyon National Park</h1>
      <p class="sub">South Rim · hand-drawn illustrated travel map (schematic)</p>
    </div>
  </header>

  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1200 640" role="img" aria-label="Grand Canyon South Rim illustrated map">
      <defs>
        <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
        </filter>
        <filter id="wobbleSoft" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
        </filter>
        <filter id="paperTex" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
          <feColorMatrix in="n" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.05 0"/>
        </filter>
        <!-- rim path (single source of truth) -->
        <path id="rimPath" d="M40,228 C120,214 200,206 290,200 C360,195 400,193 430,210
          C470,245 520,300 575,345 C610,372 630,385 651,393
          C665,402 660,420 652,432 C646,442 650,448 660,442
          C672,434 678,410 684,379 C690,368 720,362 755,365
          C775,364 790,368 802,373 C830,380 860,355 900,325
          C950,290 1000,270 1066,257 C1100,250 1130,250 1165,254" fill="none"/>
        <clipPath id="gorgeClip">
          <path d="M40,228 C120,214 200,206 290,200 C360,195 400,193 430,210
          C470,245 520,300 575,345 C610,372 630,385 651,393
          C665,402 660,420 652,432 C646,442 650,448 660,442
          C672,434 678,410 684,379 C690,368 720,362 755,365
          C775,364 790,368 802,373 C830,380 860,355 900,325
          C950,290 1000,270 1066,257 C1100,250 1130,250 1165,254
          L1165,-60 L40,-60 Z"/>
        </clipPath>
        <!-- category glyphs (24x24, stroke=currentColor) -->
        <g id="g-viewpoint" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M-11,0 C-6,-7.5 6,-7.5 11,0 C6,7.5 -6,7.5 -11,0 Z"/>
          <circle cx="0" cy="0" r="3.1" fill="currentColor" stroke="none"/>
        </g>
        <g id="g-trailhead" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M-9,9 C-3,5 -11,1 -3,-2 C3,-4.5 -3,-7 5,-10" stroke-dasharray="3.5 3"/>
          <circle cx="6.5" cy="-10" r="2.6" fill="currentColor" stroke="none"/>
        </g>
        <g id="g-hub" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="-10.5" y="-7.5" width="21" height="12.5" rx="3"/>
          <path d="M-10.5,-1 H10.5"/>
          <circle cx="-6" cy="7.5" r="2.3" fill="currentColor" stroke="none"/>
          <circle cx="6" cy="7.5" r="2.3" fill="currentColor" stroke="none"/>
        </g>
        <g id="g-lodge" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-10.5,1.5 L0,-9 L10.5,1.5"/>
          <rect x="-7.5" y="1.5" width="15" height="8.5"/>
          <rect x="-2" y="4.5" width="4" height="5.5" fill="currentColor" stroke="none"/>
        </g>
        <g id="g-cultural" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-10.5,9 L-10.5,3 L-5.5,3 L-5.5,-2.5 L-0.5,-2.5 L-0.5,-8 L4.5,-8 L4.5,-2.5 L10.5,-2.5 L10.5,9 Z"/>
        </g>
        <g id="g-star">
          <path d="M0,-7.5 L2.1,-2.3 L7.5,-2.3 L3.1,0.9 L4.7,6.1 L0,3 L-4.7,6.1 L-3.1,0.9 L-7.5,-2.3 L-2.1,-2.3 Z"
            fill="#e8a13a" stroke="#8a5a2b" stroke-width="1.2"/>
        </g>
        <g id="pine">
          <path d="M0,-14 L7,-2 L3.5,-2 L8,8 L-8,8 L-3.5,-2 L-7,-2 Z" fill="#5f7350"/>
          <rect x="-1.6" y="8" width="3.2" height="5" fill="#6a4a28"/>
        </g>
      </defs>

      <!-- paper -->
      <rect x="0" y="0" width="1200" height="640" fill="#f6eeda"/>
      <rect x="0" y="0" width="1200" height="640" filter="url(#paperTex)" opacity="0.55"/>

      <!-- south plateau wash -->
      <g filter="url(#wobble)" opacity="0.55">
        <path d="M0,640 L0,300 C150,280 300,260 450,320 C600,380 700,470 850,430 C1000,390 1100,330 1200,340 L1200,640 Z" fill="#efe0bf"/>
      </g>

      <!-- canyon strata (clipped to gorge) -->
      <g clip-path="url(#gorgeClip)" filter="url(#wobble)">
        <rect x="-20" y="-60" width="1240" height="80" fill="#ecdcb0"/>
        <rect x="-20" y="20"  width="1240" height="80" fill="#e3c78d"/>
        <rect x="-20" y="100" width="1240" height="80" fill="#d29a5c"/>
        <rect x="-20" y="180" width="1240" height="80" fill="#bd7040"/>
        <rect x="-20" y="260" width="1240" height="80" fill="#a55636"/>
        <rect x="-20" y="340" width="1240" height="80" fill="#8a5a44"/>
        <rect x="-20" y="420" width="1240" height="80" fill="#5f4636"/>
        <!-- colorado river -->
        <path d="M40,120 C120,105 190,118 270,108 C350,98 420,60 500,70 C580,80 600,150 660,190
                 C700,215 740,200 800,180 C870,155 930,150 1000,140 C1050,133 1110,138 1165,142"
              fill="none" stroke="#6fa8bd" stroke-width="8" stroke-linecap="round"/>
        <path d="M40,120 C120,105 190,118 270,108 C350,98 420,60 500,70 C580,80 600,150 660,190
                 C700,215 740,200 800,180 C870,155 930,150 1000,140 C1050,133 1110,138 1165,142"
              fill="none" stroke="#c4e2ec" stroke-width="3" stroke-linecap="round"/>
        <!-- buttes on far side -->
        <g fill="#b98a5a" opacity="0.85">
          <path d="M180,60 l26,-34 l26,34 z"/>
          <path d="M880,52 l32,-40 l32,40 z"/>
          <path d="M700,44 l22,-28 l22,28 z"/>
        </g>
      </g>

      <!-- rim edge -->
      <g filter="url(#wobble)">
        <use href="#rimPath" stroke="#3a2410" stroke-width="10" opacity="0.18" transform="translate(0,5)"/>
        <use href="#rimPath" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round"/>
        <use href="#rimPath" stroke="#8a5a2b" stroke-width="1.6" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.8"/>
      </g>

      <!-- roads & trails -->
      <g filter="url(#wobble)" fill="none" stroke-linecap="round">
        <!-- Hermit Road (west) -->
        <path d="M389,196 C320,192 240,190 160,196 C145,197 138,198 134,199"
              stroke="#b06a3b" stroke-width="4.5" stroke-dasharray="11 7"/>
        <!-- Desert View Drive (east) -->
        <path d="M389,196 C460,215 520,260 575,310 C610,345 630,370 651,393
                 C680,410 720,400 760,385 C800,372 830,360 870,335 C920,305 980,280 1066,257"
              stroke="#9a8a6a" stroke-width="4.5" stroke-dasharray="11 7"/>
        <!-- spur to Tusayan Ruin -->
        <path d="M990,278 C985,340 983,400 983,452" stroke="#9a8a6a" stroke-width="3.5" stroke-dasharray="9 7"/>
        <!-- Bright Angel Trail switchbacks -->
        <path d="M396,208 l-14,-15 l26,-9 l-26,-9 l26,-9 l-26,-9 l26,-9 l-22,-10 l18,-12 l-14,-12"
              stroke="#7a5c3a" stroke-width="3" stroke-dasharray="5 4"/>
        <!-- South Kaibab Trail -->
        <path d="M651,439 C648,400 656,360 650,320 C645,280 653,240 649,205"
              stroke="#7a5c3a" stroke-width="3" stroke-dasharray="5 4"/>
        <!-- Grandview Trail -->
        <path d="M684,379 C700,362 716,352 732,342" stroke="#7a5c3a" stroke-width="3" stroke-dasharray="5 4"/>
        <!-- red shuttle dots on Hermit Rd -->
        <g fill="#c0392b" stroke="none">
          <circle cx="300" cy="193" r="4"/><circle cx="220" cy="193" r="4"/><circle cx="150" cy="198" r="4"/>
        </g>
      </g>

      <!-- village houses -->
      <g filter="url(#wobbleSoft)" opacity="0.9">
        <g fill="#d9b98a" stroke="#8a5a2b" stroke-width="1.5">
          <rect x="330" y="222" width="18" height="12"/><path d="M330,222 l9,-7 l9,7" fill="none"/>
          <rect x="420" y="248" width="20" height="13"/><path d="M420,248 l10,-8 l10,8" fill="none"/>
          <rect x="300" y="250" width="16" height="11"/><path d="M300,250 l8,-6 l8,6" fill="none"/>
        </g>
      </g>

      <!-- pines -->
      <g filter="url(#wobbleSoft)" opacity="0.85">
        <use href="#pine" transform="translate(180,330) scale(1.1)"/>
        <use href="#pine" transform="translate(260,460) scale(0.9)"/>
        <use href="#pine" transform="translate(380,530) scale(1.2)"/>
        <use href="#pine" transform="translate(480,480) scale(0.85)"/>
        <use href="#pine" transform="translate(560,570) scale(1.1)"/>
        <use href="#pine" transform="translate(700,545) scale(0.9)"/>
        <use href="#pine" transform="translate(830,530) scale(1.15)"/>
        <use href="#pine" transform="translate(930,480) scale(0.85)"/>
        <use href="#pine" transform="translate(1020,570) scale(1.05)"/>
        <use href="#pine" transform="translate(1105,460) scale(0.9)"/>
        <use href="#pine" transform="translate(240,570) scale(1.0)"/>
        <use href="#pine" transform="translate(880,590) scale(0.95)"/>
      </g>

      <!-- map text labels -->
      <g font-size="15">
        <text class="maplabel" x="296" y="86" transform="rotate(-4 296 86)">Colorado River</text>
        <text class="maplabel" x="986" y="34">North Rim →</text>
        <text class="maplabel" x="228" y="180" font-size="12.5">Hermit Rd · Red shuttle bus</text>
        <text class="maplabel" x="872" y="306" font-size="12.5" transform="rotate(-14 872 306)">Desert View Dr</text>
        <text class="maplabel" x="448" y="148" font-size="12" transform="rotate(-62 448 148)">Bright Angel Trail</text>
        <text class="maplabel" x="668" y="310" font-size="12" transform="rotate(-84 668 310)">South Kaibab Trail</text>
      </g>

      <!-- compass + scale -->
      <g filter="url(#wobbleSoft)">
        <circle cx="1120" cy="96" r="24" fill="#fffdf5" stroke="#8a5a2b" stroke-width="2.5"/>
        <path d="M1120,80 L1126,104 L1120,99 L1114,104 Z" fill="#b3541e"/>
        <text x="1120" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3d1e">N</text>
        <g stroke="#5a3d1e" stroke-width="2.5">
          <line x1="1010" y1="606" x2="1144" y2="606"/>
          <line x1="1010" y1="600" x2="1010" y2="612"/>
          <line x1="1144" y1="600" x2="1144" y2="612"/>
        </g>
        <text x="1077" y="598" text-anchor="middle" font-size="12" fill="#5a3d1e">5 km</text>
      </g>

      <!-- leaders + markers injected by JS -->
      <g id="leaders"></g>
      <g id="markers" filter="url(#wobbleSoft)"></g>
    </svg>

    <div id="legend">
      <details id="legendDetails" open>
        <summary>Legend</summary>
        <div class="row">
          <img id="legImgRec" class="legimg" alt="must-see example">
          <span>★ Must-see</span>
        </div>
        <div class="row">
          <img id="legImgSec" class="legimg small" alt="also worth a stop example">
          <span>Also worth a stop</span>
        </div>
        <div class="cats" id="legendCats"></div>
      </details>
    </div>

    <div id="popup" hidden role="dialog" aria-modal="false">
      <button id="popClose" aria-label="close">×</button>
      <img id="popImg" alt="">
      <div id="popPills"><span class="pill" id="popTier"></span><span class="pill cat" id="popCat"></span></div>
      <h2 id="popName"></h2>
      <p id="popBlurb"></p>
      <div id="popNote"></div>
    </div>
  </div>

  <footer>Hand-drawn &amp; schematic, not to scale · Step 2 adds live GPS + one-tap Google Maps navigation</footer>
</div>
<script>
"use strict";
/* POI data injected at build time from data/grand-canyon-pois.json */
const POIS = [{"blurb_en": "South Rim basecamp: visitor center, lodges, dining and the free shuttle hub.", "category": "hub", "id": "grand-canyon-village", "lat": 36.0619, "lng": -112.1077, "name_en": "Grand Canyon Village", "tier": "recommended", "verified": false}, {"blurb_en": "The classic corridor trailhead — water and shade, great even for a short out-and-back.", "category": "trailhead", "id": "bright-angel-trailhead", "lat": 36.0578, "lng": -112.1049, "name_en": "Bright Angel Trailhead", "tier": "recommended", "verified": false}, {"blurb_en": "The classic South Rim overlook — front row for sunrise, walkable from the visitor center.", "category": "viewpoint", "id": "mather-point", "lat": 35.9953, "lng": -111.9988, "name_en": "Mather Point", "tier": "recommended", "verified": false}, {"blurb_en": "Home of the Geology Museum — read 2 billion years of rock layers, then look.", "category": "viewpoint", "id": "yavapai-point", "lat": 36.0643, "lng": -112.1017, "name_en": "Yavapai Point / Geology Museum", "tier": "recommended", "verified": false}, {"blurb_en": "Pueblo-style stone tower with panoramic views of the canyon and the Colorado's bend.", "category": "viewpoint", "id": "desert-view-watchtower", "lat": 36.0412, "lng": -111.8264, "name_en": "Desert View Watchtower", "tier": "recommended", "verified": false}, {"blurb_en": "One of the widest South Rim vistas; trailhead of the historic Grandview Trail.", "category": "viewpoint", "id": "grandview-point", "lat": 35.9999, "lng": -111.9853, "name_en": "Grandview Point", "tier": "recommended", "verified": false}, {"blurb_en": "Stone resthouse at the west end of Hermit Road — best done at sunset via the Red shuttle.", "category": "viewpoint", "id": "hermits-rest", "lat": 36.0609, "lng": -112.2136, "name_en": "Hermit's Rest", "tier": "recommended", "verified": false}, {"blurb_en": "The most scenic descent (no water, no shade) — Ooh Aah Point makes a perfect turnaround.", "category": "trailhead", "id": "south-kaibab-trailh /* ---- geo -> svg mapping (schematic, ~aspect-correct) ---- */
const MIN_LAT = 35.96, MAX_LAT = 36.08, MIN_LNG = -112.24, MAX_LNG = -111.80;
const KMX = 111.32 * Math.cos(36.03 * Math.PI / 180); // ~89.9
const KMY = 110.57;
const L = 70, T = 142, SCALE = 26.8; // tuned to match hand-authored scenery
function proj(lat, lng){
  return [ L + (lng - MIN_LNG) * KMX * SCALE, T + (MAX_LAT - lat) * KMY * SCALE ];
}

/* presentation-only nudges so clustered markers don't overlap (true spot = small dot + leader) */
const NUDGE = {
  "grand-canyon-village": [
    -80,
    -70
  ],
  "kolb-studio": [
    110,
    -40
  ],
  "bright-angel-lodge": [
    -60,
    110
  ],
  "bright-angel-trailhead": [
    40,
    110
  ],
  "yavapai-point": [
    20,
    -120
  ],
  "mather-point": [
    -90,
    -60
  ],
  "grandview-point": [
    70,
    -50
  ],
  "south-kaibab-trailhead": [
    -70,
    80
  ],
  "yaki-point": [
    60,
    110
  ],
  "lipan-point": [
    0,
    120
  ],
  "moran-point": [
    90,
    20
  ]
};

const CAT_ORDER = ["viewpoint","trailhead","hub","lodge","cultural"];

const svgNS = "http://www.w3.org/2000/svg";
const markersG = document.getElementById("markers");
const leadersG = document.getElementById("leaders");

function el(name, attrs, parent){
  const n = document.createElementNS(svgNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function labelPos(x, y, R, anchor){
  switch(anchor){
    case "above": return { x:x, y:y - R - 12, anchor:"middle" };
    case "left":  return { x:x - R - 9, y:y + 4, anchor:"end" };
    case "right": return { x:x + R + 9, y:y + 4, anchor:"start" };
    default:      return { x:x, y:y + R + 17, anchor:"middle" };
  }
}

const CATS = { viewpoint:"viewpoint", trailhead:"trailhead", hub:"hub", lodge:"lodge & dining", cultural:"cultural site" };
const LABELS = {
  "grand-canyon-village":"Grand Canyon Village", "bright-angel-trailhead":"Bright Angel Trailhead",
  "mather-point":"Mather Point", "yavapai-point":"Yavapai Point",
  "desert-view-watchtower":"Desert View Watchtower", "grandview-point":"Grandview Point",
  "hermits-rest":"Hermit's Rest", "south-kaibab-trailhead":"South Kaibab Trailhead",
  "yaki-point":"Yaki Point", "lipan-point":"Lipan Point", "moran-point":"Moran Point",
  "tusayan-ruin":"Tusayan Ruin", "kolb-studio":"Kolb Studio", "bright-angel-lodge":"Bright Angel Lodge"
};

function buildMarkers(){
  const defs = document.querySelector("#map defs");
  POIS.forEach(p => {
    const [tx, ty] = proj(p.lat, p.lng);
    const n = NUDGE[p.id] || { dx:0, dy:0, label:"below" };
    const x = tx + n.dx, y = ty + n.dy;
    const rec = p.tier === "recommended";
    const R = rec ? 62 : 42;

    if (n.dx || n.dy){
      el("line", { x1:tx, y1:ty, x2:x, y2:y, "class":"leader" }, leadersG);
      el("circle", { cx:tx, cy:ty, r:3.2, "class":"truedot" }, leadersG);
    }

    const g = el("g", {
      "class":"poi" + (rec ? "" : " sec"),
      transform:`translate(${x.toFixed(1)},${y.toFixed(1)})`,
      tabindex:"0", role:"button", "data-id":p.id,
      "aria-label": p.name_en
    }, markersG);

    el("ellipse", { cx:0, cy:R - 2, rx:R*0.85, ry:5, fill:"#3a2410", opacity:"0.18" }, g);
    el("circle", { cx:0, cy:0, r:R, "class":"badge" }, g);
    const clip = el("clipPath", { id:"clip-" + p.id }, defs);
    el("circle", { cx:0, cy:0, r:R - 4 }, clip);
    const im = el("image", {
      x:-(R-4), y:-(R-4), width:2*(R-4), height:2*(R-4),
      "clip-path":`url(#clip-${p.id})`, preserveAspectRatio:"xMidYMid slice"
    }, g);
    im.setAttribute("href", IMG[p.id]);
    im.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", IMG[p.id]);
    if (rec){
      el("use", { href:"#g-star", transform:`translate(${R-14},${-R+8}) scale(1.6)` }, g);
    }
    const lp = labelPos(0, 0, R, n.label);
    const t = el("text", { x:lp.x, y:lp.y, "text-anchor":lp.anchor, "class":"plabel" }, g);
    t.textContent = LABELS[p.id] || p.name_en;

    g.addEventListener("click", ev => { ev.stopPropagation(); openPopup(p); });
    g.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openPopup(p); }
    });
  });
}

/* ---- popup ---- */
const popup = document.getElementById("popup");
let openPoiId = null;
function openPopup(p){
  openPoiId = p.id;
  const rec = p.tier === "recommended";
  const tierEl = document.getElementById("popTier");
  tierEl.textContent = rec ? "\u2605 Must-see" : "Also worth a stop";
  tierEl.className = "pill " + (rec ? "rec" : "sec");
  document.getElementById("popCat").textContent = CATS[p.category];
  document.getElementById("popName").textContent = p.name_en;
  document.getElementById("popBlurb").textContent = p.blurb_en;
  document.getElementById("popNote").textContent = p.verified ? "" : "\uD83D\uDCCC Illustrative position; exact coordinates pending verification";
  const im = document.getElementById("popImg");
  im.src = IMG[p.id]; im.alt = p.name_en;
  popup.hidden = false;
}
function closePopup(){ popup.hidden = true; openPoiId = null; }
document.getElementById("popClose").addEventListener("click", closePopup);
document.getElementById("map").addEventListener("click", closePopup);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePopup(); });

/* ---- legend (English) ---- */
function renderCats(){
  const box = document.getElementById("legendCats");
  box.innerHTML = "";
  CAT_ORDER.forEach(c => {
    const span = document.createElement("span");
    span.className = "row";
    span.innerHTML =
      `<svg width="22" height="22" viewBox="-13 -13 26 26">` +
      `<use href="#g-${c}" color="#5a3d1e"/></svg><span>${CATS[c]}</span>`;
    box.appendChild(span);
  });
  document.getElementById("legImgRec").src = IMG["mather-point"];
  document.getElementById("legImgSec").src = IMG["yaki-point"];
}

/* ---- init ---- */
buildMarkers();
renderCats();
if (window.innerWidth < 640){
  document.getElementById("legendDetails").removeAttribute("open");
}
</script>
